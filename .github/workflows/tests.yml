name: tests
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # Windows PowerShell 5.1 and PowerShell 7
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if ($PSVersionTable.PSVersion.Major -lt 6) { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.6.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Download and verify restic (SHA256SUMS + pinned hash)
        run: .\scripts\Install-Restic.ps1

      - name: Analyzer + unit + integration tests (real restic)
        run: .\tests\Invoke-Tests.ps1 -Integration -CI

      - name: End-to-end demo
        run: .\scripts\Invoke-Demo.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shell }}
          path: TestResults/
